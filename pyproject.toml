[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "renpho-health"
version = "0.1.0"
description = "CLI + home-manager module for fetching Renpho scale data"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "whexy" }]
dependencies = [
    # The `renpho` library is provided by Nix (built from the renpho-api
    # flake input). It is NOT listed here so pip-based dev installs stay
    # honest: install it with `pip install renpho-api` in a venv if you
    # want to hack outside Nix.
]

[project.scripts]
renpho-health = "renpho_health.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
